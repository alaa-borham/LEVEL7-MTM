<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="Tahoma, Arial, sans-serif">
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="45" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a1a1a">سؤال: ما معنى أجزاء رقم الطلب؟</text>
  <text x="450" y="78" text-anchor="middle" font-size="16" fill="#555">من الملف Order-9-53-1_2.xml</text>

  <!-- order number blocks -->
  <g font-size="44" font-weight="bold" text-anchor="middle" direction="ltr">
    <rect x="150" y="110" width="110" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="205" y="166" fill="#1e3a8a">9</text>
    <text x="285" y="166" fill="#888">-</text>
    <rect x="310" y="110" width="130" height="80" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="375" y="166" fill="#14532d">53</text>
    <text x="465" y="166" fill="#888">-</text>
    <rect x="490" y="110" width="110" height="80" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="545" y="166" fill="#713f12">1</text>
    <text x="625" y="166" fill="#888">_</text>
    <rect x="650" y="110" width="110" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="705" y="166" fill="#7f1d1d">2</text>
  </g>

  <!-- explanations -->
  <g font-size="17" text-anchor="middle">
    <text x="205" y="222" fill="#1e3a8a">الموزع Reseller</text>
    <text x="205" y="245" fill="#16a34a">✔ مؤكد من الملف</text>
    <text x="375" y="222" fill="#14532d">رقم الطلب الرئيسي؟</text>
    <text x="375" y="245" fill="#ca8a04">؟ غير مؤكد</text>
    <text x="545" y="222" fill="#713f12">رقم البند (الثوب)؟</text>
    <text x="545" y="245" fill="#ca8a04">؟ البند الثاني = 2</text>
    <text x="705" y="222" fill="#7f1d1d">مراجعة التعديل؟</text>
    <text x="705" y="245" fill="#ca8a04">؟ غير مؤكد</text>
  </g>

  <line x1="60" y1="275" x2="840" y2="275" stroke="#ddd" stroke-width="2"/>

  <text x="840" y="310" text-anchor="end" font-size="19" font-weight="bold" fill="#1a1a1a">عند تعديل الطلب وإعادة إرساله، أي شكل يصل؟</text>

  <!-- option A -->
  <rect x="60" y="330" width="780" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="820" y="360" text-anchor="end" font-size="18" font-weight="bold" fill="#111">الحالة (أ): يتغير الجزء الأخير فقط</text>
  <text x="300" y="385" text-anchor="middle" font-size="22" direction="ltr" fill="#111">9-53-1_2  →  9-53-1_<tspan fill="#dc2626" font-weight="bold">3</tspan></text>
  <text x="820" y="388" text-anchor="end" font-size="15" fill="#555">أربطه تلقائيًا بالطلب الأصلي كمراجعة جديدة</text>

  <!-- option B -->
  <rect x="60" y="415" width="780" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="820" y="445" text-anchor="end" font-size="18" font-weight="bold" fill="#111">الحالة (ب): يتغير رقم الطلب الرئيسي</text>
  <text x="300" y="470" text-anchor="middle" font-size="22" direction="ltr" fill="#111">9-53-1_2  →  9-<tspan fill="#16a34a" font-weight="bold">54</tspan>-1_0</text>
  <text x="820" y="473" text-anchor="end" font-size="15" fill="#555">لا يمكن ربطه بالأصل إلا بحقل آخر — ما هو؟</text>

  <!-- option C -->
  <rect x="60" y="500" width="780" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="820" y="530" text-anchor="end" font-size="18" font-weight="bold" fill="#111">الحالة (ج): شكل آخر</text>
  <text x="820" y="558" text-anchor="end" font-size="15" fill="#555">من فضلك أرسل مثالًا: الرقم قبل التعديل وبعده</text>

  <text x="450" y="605" text-anchor="middle" font-size="15" fill="#555">وكيف يصل إلغاء الطلب؟ (ملف خاص / حقل / لا يصل)</text>
</svg>
